{% include 'base.html' %}

<div class="container">
    <div class="card text-center">
        <div class="card-header">
            Your Store Inventory
        </div>
        <div class="card-body">
            <h5 class="card-title">List of your Store Inventory!</h5>
            <p class="card-text">Information from your Store Inventory Database</p>

            <table class="table table-hover">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Info</th>
                    <th scope="col">Cost</th>
                    <th scope="col">Description</th>
                    <th scope="col">Actions</th>

                </tr>
                </thead>
                <tbody>

                {% for item in items %}
                    <tr class="pointer">

                        <td>{{loop.index}}</td>
                        <td>{{item.item_name}}</td>
                        <td>{{item.cost}}</td>
                        <td>{{item.description}}</td>
                        <td>
                            <button onclick="window.location.href='edit-item/{{item.id}}'"
                                    type="button" class="btn btn-info">
                                Edit
                            </button>
                        </td>
                    </tr>
                
                {% endfor %}

                </tbody>
            </table>

            <a href="add-item" class="btn btn-primary">Add a new item!</a>
        </div>
    </div>
</div>
